# The base game's game-map overrides. The map reader takes everything the
# game's tables can say from the tables; this file says only what they cannot.
# A mod keeps its own game-map.overrides.toml next to its files.
game = "D2RUST base game"
final_objective = "Defeat Baal in the Worldstone Chamber"

# The five act towns (safe areas with waypoints). Mods name their own.
towns = [1, 40, 75, 103, 109]

[[act_transition]]
from = 1
to = 2
quest = "A1Q6 Sisters to the Slaughter"

[[act_transition]]
from = 2
to = 3
quest = "A2Q6 The Seven Tombs"

[[act_transition]]
from = 3
to = 4
quest = "A3Q6 The Guardian"

[[act_transition]]
from = 4
to = 5
quest = "A4Q4 Malachai"

