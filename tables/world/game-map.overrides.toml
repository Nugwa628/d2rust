# The Hell levels (Levels.txt "Act 5 - Hell 1/2/3") are entered through the
# permanent portals the Barricade Hell Portal presets (LvlPrest 955/956) place
# in the highlands, plateau and tundra; the object init maps level 111 to 125,
# 112 to 126 and 117 to 127.
