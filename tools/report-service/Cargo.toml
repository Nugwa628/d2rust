[package]
name = "report-service"
description = "Bug report intake: one upload endpoint that checks, rate limits and stores report bundles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
d2-report.workspace = true
anyhow.workspace = true
serde_json.workspace = true
sha2.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "multipart", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
getrandom = "0.3"

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
