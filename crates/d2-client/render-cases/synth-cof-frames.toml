# render-pipeline.md §A7: the slot order comes from the COF's draw order
# for the given (direction, frame). The same COF and the same component
# layout at d1 f1 (TR RH HD) and at d0 f0 (TR HD RH) give different
# front components. Equal unit keys: list order (unit 0 first) decides.
version = 1
kind = "synthetic"
description = "one COF at two (direction, frame) pairs, same layout, different slot order"
view = [0, 0, 64, 64]

[[frame]] # 0: HD
width = 8
height = 8
fill = 10

[[frame]] # 1: TR
width = 8
height = 8
fill = 20

[[frame]] # 2: RH
width = 8
height = 8
fill = 40

[[unit]]
cof = """
03 02 02 14 00000000
f6ffffff 0a000000 ecffffff 00000000 19000000
00 00 01 00 00 68746800
01 01 01 00 00 68746800
05 02 01 00 00 31687300
01 00
01 00 05  05 01 00
00 05 01  01 05 00
"""
dir = 1
frame = 1
key = [1, 0, 0]

[[unit.component]]
component = 0
frame = 0
x = 4
y = 4

[[unit.component]]
component = 1
frame = 1
x = 6
y = 6

[[unit.component]]
component = 5
frame = 2
x = 8
y = 8

[[unit]]
cof = """
03 02 02 14 00000000
f6ffffff 0a000000 ecffffff 00000000 19000000
00 00 01 00 00 68746800
01 01 01 00 00 68746800
05 02 01 00 00 31687300
01 00
01 00 05  05 01 00
00 05 01  01 05 00
"""
dir = 0
frame = 0
key = [1, 0, 0]

[[unit.component]]
component = 0
frame = 0
x = 34
y = 34

[[unit.component]]
component = 1
frame = 1
x = 36
y = 36

[[unit.component]]
component = 5
frame = 2
x = 38
y = 38

[[expect]] # d1 f1: HD front
x = 9
y = 9
index = 10

[[expect]] # d1 f1: RH over TR
x = 12
y = 12
index = 40

[[expect]] # d0 f0: RH front
x = 39
y = 39
index = 40

[[expect]] # d0 f0: HD over TR
x = 37
y = 37
index = 10

[[expect]] # background
x = 0
y = 0
index = 0
