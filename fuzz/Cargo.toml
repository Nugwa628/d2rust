[package]
name = "d2-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# cargo-fuzz crate: not a member of the main workspace (needs nightly).
# Run from this directory: `cargo +nightly fuzz run <target>`.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
d2-formats = { path = "../crates/d2-formats", features = ["fuzz", "test-support"] }
d2-data = { path = "../crates/d2-data" }
d2-proto = { path = "../crates/d2-proto" }
d2-server = { path = "../crates/d2-server" }
d2-sim = { path = "../crates/d2-sim" }
d2-native = { path = "../crates/d2-native" }
d2-client = { path = "../crates/d2-client", features = ["dylib"], optional = true }

[features]
scenario-parser = ["dep:d2-client"]

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "mkseeds"
path = "src/mkseeds.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dc6"
path = "fuzz_targets/dc6.rs"
test = false
doc = false
bench = false

